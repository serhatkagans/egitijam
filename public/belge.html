<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katılım Belgeleri · EğitiJAM</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="ortak.css">
<script src="tema.js"></script>
<style>
  /* Katılım belgesi: her ekip üyesi için bir A4 yatay sayfa. Tarayıcının "PDF olarak kaydet" seçeneğiyle PDF'e dönüşür. */
  @page { size: A4 landscape; margin: 0; }
  body { background: var(--panel2); }
  .arac-cubuk { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .arac-cubuk .kap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .arac-cubuk p { margin: 0; flex: 1 1 320px; font-size: 13.5px; color: var(--muted); }
  .sayfalar { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 16px 48px; }
  .belge { width: 297mm; height: 210mm; background: #fff; color: #1d1d1f; position: relative; overflow: hidden; box-shadow: var(--golge-yuksek);
    font-family: var(--yazi-govde); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 22mm 26mm 18mm; box-sizing: border-box;
    print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .belge::before { content: ""; position: absolute; inset: 9mm; border: 1.2mm solid var(--renk-birincil); border-radius: 4mm; pointer-events: none; }
  .belge::after { content: ""; position: absolute; inset: 12mm; border: .4mm solid var(--renk-birincil); opacity: .35; border-radius: 2.5mm; pointer-events: none; }
  .belge .b-serit { position: absolute; top: 0; left: 0; right: 0; height: 6mm; background: var(--renk-birincil); }
  .belge .b-ust { display: flex; align-items: center; justify-content: center; gap: 6mm; }
  .belge .b-ust img { height: 16mm; }
  .belge .b-ust .b-kurum { text-align: left; line-height: 1.2; }
  .belge .b-ust .b-kurum small { display: block; font-size: 9pt; letter-spacing: .14em; color: var(--renk-birincil); font-weight: 800; }
  .belge .b-ust .b-kurum b { font-family: var(--yazi-baslik); font-size: 18pt; }
  .belge h1 { font-family: var(--yazi-baslik); font-size: 34pt; letter-spacing: .12em; margin: 10mm 0 2mm; color: var(--renk-vitrin-koyu); }
  .belge .b-alt { font-size: 12pt; color: #555; margin: 0; }
  .belge .b-ad { font-family: var(--yazi-baslik); font-size: 30pt; font-weight: 800; margin: 9mm 0 2mm; color: var(--renk-birincil); }
  .belge .b-cizgi { width: 120mm; height: .5mm; background: var(--renk-birincil); opacity: .5; margin: 0 auto 6mm; }
  .belge .b-metin { font-size: 13.5pt; line-height: 1.6; max-width: 210mm; margin: 0; }
  .belge .b-metin b { color: var(--renk-vitrin-koyu); }
  .belge .b-odul { display: inline-flex; align-items: center; gap: 2mm; margin-top: 5mm; padding: 2mm 5mm; border-radius: 99px; background: var(--renk-birincil); color: #fff; font-weight: 800; font-size: 13pt; }
  .belge .b-imza { margin-top: auto; display: flex; justify-content: space-between; width: 100%; padding: 0 12mm; font-size: 11pt; color: #444; }
  .belge .b-imza div { width: 70mm; border-top: .3mm solid #999; padding-top: 2mm; }
  @media print {
    body { background: #fff; }
    .arac-cubuk { display: none; }
    .sayfalar { padding: 0; gap: 0; display: block; }
    .belge { box-shadow: none; page-break-after: always; break-after: page; }
    .belge:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<div class="arac-cubuk"><div class="kap">
  <p id="ipucu">Yükleniyor…</p>
  <button class="btn" type="button" id="yazdir" disabled><svg class="ik"><use href="ikonlar.svg#printer"/></svg> Yazdır / PDF olarak kaydet</button>
</div></div>
<div class="sayfalar" id="sayfalar"></div>

<script src="ortak.js"></script>
<script>
const { esc, api } = EJ;
const $ = id => document.getElementById(id);
// Takım kendi oturumuyla; yönetici ya da mentör ?takim=<id>[&rol=mentor] ile açar (takım panelindeki gibi)
const PARAM = new URLSearchParams(location.search);
const takim = PARAM.get('takim');
const ROL = takim ? (PARAM.get('rol') === 'mentor' ? 'mentor' : 'yonetim') : 'takim';

async function basla() {
  let D;
  try { D = await api('GET', 'api/takim/ben' + (takim ? '?takim=' + encodeURIComponent(takim) : ''), undefined, ROL); }
  catch (e) { $('ipucu').innerHTML = `Belgeler açılamadı: ${esc(e.message)}. <a href="takim">Takım paneline</a> giriş yapıp tekrar deneyin.`; return; }
  window.temaUygula(D.tema);
  if (!D.belgeAcik) { $('ipucu').textContent = 'Katılım belgeleri teslim süresi bittikten sonra hazırlanır.'; return; }
  const e = D.event, p = D.sayfa;
  // Ekip üyeleri ve danışman öğretmen; aynı ad iki kez yazılmışsa tek belge
  const kisiler = [];
  for (const u of p.uyeler || []) if (u.ad?.trim() && !kisiler.some(k => k.ad === u.ad.trim())) kisiler.push({ ad: u.ad.trim(), rol: (u.rol || '').trim() });
  if (D.danisman?.trim() && !kisiler.some(k => k.ad === D.danisman.trim())) kisiler.push({ ad: D.danisman.trim(), danisman: true });
  if (!kisiler.length) { $('ipucu').textContent = 'Oyun sayfasının "Ekip" bölümüne üye eklenmemiş. Önce ekip üyelerini girin.'; return; }
  const ad = e.ad || 'EğitiJAM', oyun = p.baslik ? `“${esc(p.baslik)}” oyununu` : 'bir oyun';
  $('sayfalar').innerHTML = kisiler.map(k => `
    <section class="belge">
      <div class="b-serit"></div>
      <div class="b-ust"><img src="genc.png" alt=""><div class="b-kurum"><small>MEB · YEĞİTEK</small><b>${esc(e.kurum || 'GençTek')}</b></div></div>
      <h1>KATILIM BELGESİ</h1>
      <p class="b-alt">${esc(ad)}${e.altBaslik ? ' · ' + esc(e.altBaslik) : ''}</p>
      <div class="b-ad">${esc(k.ad)}</div>
      <div class="b-cizgi"></div>
      <p class="b-metin">${k.danisman
        ? `<b>${esc(D.ad)}</b> takımına danışman öğretmen olarak rehberlik ederek ${p.baslik ? `“${esc(p.baslik)}” oyununun` : 'oyunun'} geliştirilmesine katkı sağlamış ve <b>${esc(ad)}</b> etkinliğini başarıyla tamamlamıştır.`
        : `<b>${esc(D.ad)}</b> takımında${k.rol ? ` <b>${esc(k.rol)}</b> göreviyle` : ''} ${oyun} geliştirerek <b>${esc(ad)}</b> etkinliğini başarıyla tamamlamıştır.`}
        ${e.tema ? `<br>Etkinlik teması: <b>${esc(e.tema)}</b>` : ''}</p>
      ${D.rozet ? `<div class="b-odul">🏆 ${esc(D.rozet)}</div>` : ''}
      <div class="b-imza"><div>${esc(e.tarih || new Date().toLocaleDateString('tr-TR'))}</div><div>${esc(ad)} Organizasyon Komitesi</div></div>
    </section>`).join('');
  $('ipucu').innerHTML = `<b>${kisiler.length} belge</b> hazır. Yazdır penceresinde <b>Hedef: PDF olarak kaydet</b>, <b>Kenar boşlukları: Yok</b> seçin ve <b>Arka plan grafikleri</b>ni açın.`;
  $('yazdir').disabled = false;
  document.title = `Katılım Belgeleri · ${D.ad}`;
}
$('yazdir').onclick = () => print();
basla();
</script>
</body>
</html>
