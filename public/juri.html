<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jüri Paneli · EğitiJAM</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="ortak.css">
<script src="tema.js"></script>
<style>
  .duzen { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; max-width: 1400px; margin: 20px auto; padding: 0 16px; align-items: start; }
  @media (max-width: 900px) { .duzen { grid-template-columns: 1fr; } }
  .sol { position: sticky; top: 76px; padding: 14px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; }
  @media (max-width: 900px) { .sol { position: static; max-height: none; } }
  .ilerleme { font-size: 13.5px; color: var(--muted); }
  .ilerleme b { color: var(--text); }
  .sekme { display: flex; gap: 4px; margin: 10px 0; background: var(--panel2); padding: 4px; border-radius: 10px; }
  .sekme button { flex: 1; border: 0; background: transparent; padding: 7px 6px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .sekme button.secili { background: var(--panel); color: var(--accent-text); box-shadow: var(--golge-kart); }
  .liste { list-style: none; margin: 8px 0 0; padding: 0; overflow: auto; flex: 1; }
  @media (max-width: 900px) { .liste { max-height: 320px; } }
  .liste li button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; padding: 8px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; }
  .liste li button:hover { background: var(--panel2); }
  .liste li button.secili { background: var(--accent-soft); outline: 1px solid var(--renk-vitrin-cizgi); }
  .liste img, .liste .yk { width: 52px; height: 41px; border-radius: 6px; object-fit: cover; flex: none; background: var(--renk-vitrin); }
  .liste .m { flex: 1; min-width: 0; }
  .liste .m b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .liste .m small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .liste .p { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ok-text); font-size: 15px; }
  .liste .p.yok { color: var(--line-strong); font-weight: 400; }

  .sag { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .urun-bas { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; padding: 18px; }
  @media (max-width: 640px) { .urun-bas { grid-template-columns: 1fr; } }
  .urun-bas img, .urun-bas .yk { width: 100%; aspect-ratio: 315/250; object-fit: cover; border-radius: 10px; background: var(--renk-vitrin); }
  .urun-bas h2 { margin: 0; font-size: 24px; }
  .urun-bas .tk { color: var(--accent-text); font-weight: 600; margin-top: 2px; }
  .urun-bas .yer { color: var(--muted); font-size: 14px; }
  .urun-bas .ks { margin: 10px 0 0; }
  .urun-bas .eylem { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .urun-bas .neler { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  .puanla { padding: 20px; }
  .puanla h2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .kr { padding: 14px 0; border-top: 1px solid var(--line); }
  .kr:first-of-type { border-top: 0; }
  .kr-bas { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .kr-bas .t { font-weight: 600; }
  .kr-bas .t small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .kr-bas .v { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--accent-text); min-width: 54px; text-align: right; }
  .kr-bas .v.yok { color: var(--line-strong); }
  .puanlar { display: flex; flex-wrap: wrap; gap: 4px; }
  .puanlar button { width: 38px; height: 36px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; }
  .puanlar button:hover:not(:disabled) { border-color: var(--accent); }
  .puanlar button.secili { background: var(--renk-birincil); color: #fff; border-color: var(--renk-birincil); }
  .puanlar button:disabled { cursor: not-allowed; opacity: .6; }
  @media (max-width: 520px) { .puanlar button { width: 34px; height: 34px; font-size: 13px; } }
  .toplam { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; margin-top: 8px; border-radius: var(--yaricap-kutu);
    background: var(--panel2); flex-wrap: wrap; }
  .toplam .s { font-family: var(--yazi-baslik); font-size: 34px; font-weight: 800; color: var(--renk-baslik); line-height: 1; }
  .toplam .s small { font-size: 16px; color: var(--muted); font-weight: 600; }
  .toplam .eylem { display: flex; gap: 8px; flex-wrap: wrap; }
  .kayitli { color: var(--ok-text); font-size: 13px; font-weight: 600; }
  .ust nav + .kim { margin-left: 14px; }
  .ust .kim { margin-left: auto; color: var(--muted); font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .ust .kim b { color: var(--accent-text); }
</style>
</head>
<body>

<div id="girisEkran" class="giris hidden">
  <form class="kart" id="girisForm">
    <img class="logo" src="genc.png" alt="">
    <h1>Jüri girişi</h1>
    <p class="alt" id="gAlt">EğitiJAM değerlendirme paneli</p>
    <label class="l" for="gKul">Kullanıcı adı <small>(ad + soyad, bitişik: alidemir)</small></label>
    <input type="text" id="gKul" autocomplete="username" autocapitalize="none" required>
    <label class="l" for="gSif">Şifre</label>
    <input type="password" id="gSif" autocomplete="current-password" required>
    <button class="btn" type="submit">Giriş yap</button>
    <div class="hata" id="gHata" role="alert"></div>
    <a class="geri" href="./">← Oyun vitrinine dön</a>
  </form>
</div>

<div id="panel" class="hidden">
  <header class="ust">
    <div class="ust-ic">
      <a class="gt-brand" href="./"><img src="genc.png" alt=""><span class="gt-yazi"><small>MEB · YEĞİTEK</small><b>GençTek</b></span></a>
      <a class="ej" href="./">Eğiti<span>JAM</span> <small style="font-weight:600;color:var(--muted);font-size:13px">Jüri</small></a>
      <nav><a href="./">Vitrin</a><a href="#" id="puanAc" class="secili">Puanlama</a><a href="#" id="mesajAc">Mesajlar<span id="mesajSayac"></span></a></nav>
      <div class="kim"><span><b id="juriAd"></b></span><button class="btn ghost sm" id="cikis" type="button"><svg class="ik"><use href="ikonlar.svg#log-out"/></svg> Çıkış</button></div>
    </div>
  </header>
  <div id="uyari" class="kap" style="margin-top:16px"></div>
  <div class="duzen">
    <aside class="kart sol">
      <div class="ilerleme" id="ilerleme"></div>
      <div class="cubuk"><i id="ilerlemeCubuk"></i></div>
      <div class="sekme" role="tablist">
        <button type="button" data-f="hepsi" class="secili">Tümü</button>
        <button type="button" data-f="bekleyen">Puanlanmadı</button>
        <button type="button" data-f="puanli">Puanlandı</button>
      </div>
      <input type="search" id="ara" placeholder="Oyun ya da takım ara" aria-label="Ara">
      <ul class="liste" id="liste"></ul>
    </aside>
    <main class="sag" id="sag"><div class="kart bos">Değerlendirmek için soldan bir oyun seçin.</div></main>
  </div>
  <div class="kap hidden" id="mesajGorunum" style="margin-top:20px"><div id="sohbet"></div></div>
</div>

<script src="ortak.js"></script>
<script src="sohbet.js"></script>
<script>
const { esc, ik, api, dosya, bildir } = EJ;
const $ = id => document.getElementById(id);
let D = null, secili = null, filtre = 'hepsi', taslak = null;

// Puanlama / Mesajlar görünümü (puanlama taslağı korunur)
let sohbet = null;
function gorunum(g) {
  document.querySelector('.duzen').classList.toggle('hidden', g !== 'puan');
  $('uyari').classList.toggle('hidden', g !== 'puan');
  $('mesajGorunum').classList.toggle('hidden', g !== 'mesaj');
  $('puanAc').classList.toggle('secili', g === 'puan');
  $('mesajAc').classList.toggle('secili', g === 'mesaj');
  if (sohbet) sohbet.goster(g === 'mesaj');
  history.replaceState(null, '', g === 'mesaj' ? '#mesajlar' : location.pathname);
}
$('puanAc').onclick = e => { e.preventDefault(); gorunum('puan'); };
$('mesajAc').onclick = e => { e.preventDefault(); gorunum('mesaj'); };

function girisGoster() { $('girisEkran').classList.remove('hidden'); $('panel').classList.add('hidden'); $('gKul').focus(); }

async function yenile() {
  try { D = await api('GET', 'api/juri/durum', undefined, 'juri'); }
  catch (e) { if (e.status === 401) { EJ.jetonYaz('juri', null); return girisGoster(); } bildir(e.message, 'h'); return; }
  window.temaUygula(D.tema);
  $('girisEkran').classList.add('hidden'); $('panel').classList.remove('hidden');
  if (!sohbet) {
    sohbet = EJSohbet({ kok: $('sohbet'), rol: 'juri', odaklan: () => gorunum('mesaj'), degisti: n => {
      $('mesajSayac').innerHTML = n ? `<span class="sayac-rozet">${n > 99 ? '99+' : n}</span>` : '';
      document.title = (n ? `(${n}) ` : '') + 'Jüri Paneli · EğitiJAM';
    } });
    if (location.hash === '#mesajlar') gorunum('mesaj');
  }
  EJ.marka(D.event.ad);
  $('juriAd').textContent = D.name + (D.odali ? ` · ${D.asama === 'final' ? 'Final' : D.oda || 'Odasız'}` : '');
  const u = [];
  if (D.odali && D.asama === 'final') u.push(`<div class="bilgi k">${ik('trophy')} <b>Final aşaması.</b> Tüm jüriler finale kalan ${D.urunler.length} oyunu puanlar. Ön eleme puanlarınız ayrı saklanır.</div>`);
  else if (D.odali && D.oda) u.push(`<div class="bilgi k">${ik('users')} <b>${esc(D.oda)}</b> · Ön eleme. Yalnızca odanıza atanan ${D.urunler.length} oyunu puanlıyorsunuz.</div>`);
  else if (D.odali) u.push(`<div class="bilgi u">${ik('triangle-alert')} Henüz bir odaya atanmadınız. Yönetici sizi bir odaya atadığında oyunlar burada görünecek.</div>`);
  if (!D.oylamaAcik) u.push(`<div class="bilgi u">${ik('lock')} Oylama şu anda kapalı. Oyunları inceleyebilirsiniz; puan verme yönetici oylamayı açınca etkinleşir.</div>`);
  $('uyari').innerHTML = u.length ? `<div style="display:flex;flex-direction:column;gap:8px">${u.join('')}</div>` : '';
  D.urunler.sort((a, b) => (a.baslik || a.takim).localeCompare(b.baslik || b.takim, 'tr'));
  listeCiz();
  if (secili && D.urunler.some(u => u.id === secili)) detayCiz(); else if (secili) { secili = null; $('sag').innerHTML = '<div class="kart bos">Değerlendirmek için soldan bir oyun seçin.</div>'; }
}

const maks = () => D.maxTotals.ana + D.maxTotals.ek;
const topYazi = () => D.maxTotals.ana + (D.maxTotals.ek ? ` + ${D.maxTotals.ek}` : '');

function listeCiz() {
  const n = D.urunler.length, p = D.urunler.filter(u => D.votes[u.id]).length;
  $('ilerleme').innerHTML = `<b>${p} / ${n}</b> oyun puanlandı`;
  $('ilerlemeCubuk').style.width = n ? (p / n * 100) + '%' : '0';
  const q = $('ara').value.trim().toLocaleLowerCase('tr');
  const l = D.urunler.filter(u => (filtre === 'hepsi' || (filtre === 'puanli') === !!D.votes[u.id]) &&
    (!q || [u.baslik, u.takim, u.okul, u.il].join(' ').toLocaleLowerCase('tr').includes(q)));
  $('liste').innerHTML = l.length ? l.map(u => {
    const v = D.votes[u.id];
    return `<li><button type="button" data-id="${esc(u.id)}" class="${u.id === secili ? 'secili' : ''}">
      ${u.kapak ? `<img src="${dosya(u.id, u.kapak)}" alt="" loading="lazy">` : '<span class="yk"></span>'}
      <span class="m"><b>${esc(u.baslik || 'İsimsiz ürün')}</b><small>${esc(u.takim)}${u.il ? ' · ' + esc(u.il) : ''}</small></span>
      <span class="p ${v ? '' : 'yok'}">${v ? v.total : '–'}</span></button></li>`;
  }).join('') : '<li class="bos" style="padding:20px">Oyun yok</li>';
}

$('liste').onclick = e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  if (taslakDegisti() && !confirm('Kaydedilmemiş puanlar kaybolacak. Devam edilsin mi?')) return;
  secili = b.dataset.id;
  taslak = null;
  listeCiz(); detayCiz();
  if (innerWidth <= 900) $('sag').scrollIntoView({ behavior: 'smooth' });
};
document.querySelectorAll('.sekme button').forEach(b => b.onclick = () => {
  filtre = b.dataset.f;
  document.querySelectorAll('.sekme button').forEach(x => x.classList.toggle('secili', x === b));
  listeCiz();
});
$('ara').oninput = listeCiz;

function taslakDegisti() {
  if (!taslak || !secili) return false;
  const v = D.votes[secili];
  return JSON.stringify(taslak.scores) !== JSON.stringify(v ? v.scores : D.criteria.map(() => null)) || taslak.note !== (v ? v.note : '') || taslak.geri !== (D.geri?.[secili] || '');
}

function detayCiz() {
  const u = D.urunler.find(x => x.id === secili);
  const v = D.votes[u.id];
  if (!taslak) taslak = { scores: v ? [...v.scores] : D.criteria.map(() => null), note: v ? v.note : '', geri: D.geri?.[u.id] || '' };
  const kapali = !D.oylamaAcik;
  const sayfa = 'oyun/' + encodeURIComponent(u.id);
  $('sag').innerHTML = `
    <div class="kart urun-bas">
      ${u.kapak ? `<img src="${dosya(u.id, u.kapak)}" alt="">` : '<span class="yk"></span>'}
      <div>
        <h2>${esc(u.baslik || 'İsimsiz ürün')}</h2>
        <div class="tk">${esc(u.takim)}</div>
        <div class="yer">${esc([u.okul, u.il].filter(Boolean).join(' · '))}</div>
        ${u.kisa ? `<p class="ks">${esc(u.kisa)}</p>` : ''}
        <div class="neler">
          ${u.oyun ? `<span class="etiket k">${ik('play')} Tarayıcıda oynanır</span>` : ''}
          ${u.indir ? `<span class="etiket">${ik('download')} İndirilebilir</span>` : ''}
          ${u.video ? `<span class="etiket">${ik('youtube')} Video</span>` : ''}
          ${!u.oyun && !u.indir && !u.baglanti ? `<span class="etiket u">${ik('triangle-alert')} Oyun dosyası yok</span>` : ''}
        </div>
        <div class="eylem">
          <a class="btn" href="${sayfa}" target="_blank">${ik(u.oyun ? 'play' : 'external-link')} ${u.oyun ? 'Oyna ve incele' : 'Sayfayı aç'}</a>
        </div>
      </div>
    </div>
    <div class="kart puanla">
      <h2>Değerlendirme ${v ? `<span class="kayitli">${ik('check')} Kayıtlı · ${EJ.zaman(v.time)}</span>` : ''}</h2>
      ${D.criteria.map((c, i) => `<div class="kr">
        <div class="kr-bas"><span class="t">${esc(c.name)}<small>${c.ek ? `ek puan, 0-${c.max}` : `0-${c.max}`}</small></span><span class="v ${taslak.scores[i] === null ? 'yok' : ''}" id="v${i}">${taslak.scores[i] ?? '–'}</span></div>
        <div class="puanlar" data-k="${i}">${Array.from({ length: c.max + 1 }, (_, n) =>
          `<button type="button" data-n="${n}" class="${taslak.scores[i] === n ? 'secili' : ''}" ${kapali ? 'disabled' : ''}>${n}</button>`).join('')}</div>
      </div>`).join('')}
      <label class="l" for="not">Notunuz <small>(yalnızca siz ve yönetici görür)</small></label>
      <textarea id="not" rows="3" maxlength="2000" ${kapali ? 'disabled' : ''}>${esc(taslak.note)}</textarea>
      <label class="l" for="geri">Takıma geri bildirim <small>(isteğe bağlı; yönetim açınca takım bunu adınız olmadan görür; puanları görmez)</small></label>
      <textarea id="geri" rows="3" maxlength="2000" placeholder="Oyunun güçlü yanları, geliştirilebilecek noktalar…" ${kapali ? 'disabled' : ''}>${esc(taslak.geri)}</textarea>
      <div class="toplam">
        <div><div class="s" id="toplam"></div></div>
        <div class="eylem">
          ${v ? `<button class="btn danger" type="button" id="sil" ${kapali ? 'disabled' : ''}>${ik('trash-2')} Puanı sil</button>` : ''}
          <button class="btn lg" type="button" id="kaydet" ${kapali ? 'disabled' : ''}>${ik('check')} ${v ? 'Güncelle' : 'Puanı kaydet'}</button>
        </div>
      </div>
    </div>`;
  toplamCiz();
  $('sag').querySelectorAll('.puanlar').forEach(p => p.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = +p.dataset.k, n = +b.dataset.n;
    taslak.scores[k] = n;
    p.querySelectorAll('button').forEach(x => x.classList.toggle('secili', x === b));
    $('v' + k).textContent = n; $('v' + k).classList.remove('yok');
    toplamCiz();
  });
  $('not').oninput = e => taslak.note = e.target.value;
  $('geri').oninput = e => taslak.geri = e.target.value;
  $('kaydet').onclick = kaydet;
  if (v) $('sil').onclick = sil;
}

function toplamCiz() {
  const t = taslak.scores.reduce((a, s) => a + (s ?? 0), 0);
  const eksik = taslak.scores.filter(s => s === null).length;
  $('toplam').innerHTML = `${t} <small>/ ${topYazi()}</small>` + (eksik ? `<div style="font-size:13px;color:var(--warn);font-weight:600;margin-top:6px">${eksik} kriter puanlanmadı</div>` : '');
}

async function kaydet() {
  const i = taslak.scores.findIndex(s => s === null);
  if (i >= 0) return bildir(`"${D.criteria[i].name}" için puan seçin`, 'h');
  $('kaydet').disabled = true;
  try {
    D = { ...D, ...(await api('PUT', 'api/juri/oy', { takim: secili, scores: taslak.scores, note: taslak.note, geri: taslak.geri }, 'juri')) };
    taslak = null;
    bildir('Puan kaydedildi', 'o');
    // Sıradaki puanlanmamış oyuna geç
    const sira = D.urunler.find(u => !D.votes[u.id]);
    listeCiz(); detayCiz();
    if (sira) {
      const b = document.createElement('button');
      b.className = 'btn ghost'; b.type = 'button';
      b.innerHTML = `Sıradaki: ${esc(sira.baslik || sira.takim)} ${ik('arrow-right')}`;
      b.onclick = () => { secili = sira.id; taslak = null; listeCiz(); detayCiz(); scrollTo({ top: 0, behavior: 'smooth' }); };
      document.querySelector('.toplam .eylem').appendChild(b);
    }
  } catch (e) { bildir(e.message, 'h'); $('kaydet').disabled = false; }
}

async function sil() {
  if (!confirm('Bu oyuna verdiğiniz puan silinsin mi?')) return;
  try {
    D = { ...D, ...(await api('DELETE', 'api/juri/oy?takim=' + encodeURIComponent(secili), undefined, 'juri')) };
    taslak = null; listeCiz(); detayCiz();
    bildir('Puan silindi');
  } catch (e) { bildir(e.message, 'h'); }
}

$('girisForm').onsubmit = async e => {
  e.preventDefault(); $('gHata').textContent = '';
  try {
    const d = await api('POST', 'api/juri/giris', { kullanici: $('gKul').value, sifre: $('gSif').value });
    EJ.jetonYaz('juri', d.token); $('gSif').value = '';
    yenile();
  } catch (err) { $('gHata').textContent = err.message; }
};
$('cikis').onclick = async () => {
  try { await api('POST', 'api/juri/cikis', {}, 'juri'); } catch {}
  EJ.jetonYaz('juri', null); location.reload();
};
window.addEventListener('beforeunload', e => { if (taslakDegisti()) { e.preventDefault(); e.returnValue = ''; } });
// Yönetici oylamayı açıp kapattığında ya da yeni ürün eklendiğinde liste güncellensin
setInterval(() => { if (EJ.jeton('juri') && !taslakDegisti() && document.visibilityState === 'visible') yenile(); }, 60000);

if (EJ.jeton('juri')) yenile(); else girisGoster();
</script>
</body>
</html>
