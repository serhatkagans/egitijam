<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birlikte Güçlüyüz</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1430; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Örnek oyun: iki karakter aynı anda yönetilir. Kırmızı WASD, sarı ok tuşları.
// İkisi ayrı odalarda başlar, hedefler ortadaki odadadır. A kapısını (kırmızı) a düğmesi,
// B kapısını (sarı) b düğmesi açar; her karakter ancak diğerinin yardımıyla içeri girer.
// Açılan kapı açık kalır (içinden geçen karakter sıkışmasın).
const c = document.getElementById('c'), x = c.getContext('2d');
const T = 40; // kare boyutu
const BOLUMLER = [
  [ '########################',
    '#R.....#..r..y..#.....Y#',
    '#......#........#......#',
    '#......A...b....B......#',
    '#......#........#...a..#',
    '#......#........#......#',
    '########################' ],
  [ '########################',
    '#Y.....#..y..r..#.....R#',
    '#.##...#.######.#..##..#',
    '#.#....B...a....A...#..#',
    '#.#.#..#.######.#.b.#..#',
    '#...#..#........#....#.#',
    '########################' ]
];
let bolum = 0, harita, oyuncular, kapilar, kalici, bitti = false, gecis = 0, adim = 0;
const tus = {};
onkeydown = e => { tus[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); };
onkeyup = e => { tus[e.key.toLowerCase()] = false; };

function kur() {
  harita = BOLUMLER[bolum].map(s => s.split(''));
  oyuncular = {}; kapilar = {};
  harita.forEach((sat, y) => sat.forEach((ch, xx) => {
    if (ch === 'R' || ch === 'Y') { oyuncular[ch] = { x: xx * T + 6, y: y * T + 6, renk: ch === 'R' ? '#e0282f' : '#ffd25a' }; sat[xx] = '.'; }
    if (ch === 'A' || ch === 'B') kapilar[ch] = { x: xx, y };
  }));
  kalici = { A: false, B: false };
  bitti = false; adim = 0;
}
const duvar = (ch, acik) => ch === '#' || ((ch === 'A' || ch === 'B') && !acik[ch]);
function hucre(px, py) { const s = harita[Math.floor(py / T)]; return s ? s[Math.floor(px / T)] || '#' : '#'; }
function basili(ch) { // düğme a kapı A'yı, b kapı B'yi açar; düğmenin üstünde biri durmalı
  return Object.values(oyuncular).some(o => hucre(o.x + 14, o.y + 14) === ch);
}
function hareket(o, dx, dy, acik) {
  const nx = o.x + dx, ny = o.y + dy, k = 27;
  if ([[nx, ny], [nx + k, ny], [nx, ny + k], [nx + k, ny + k]].some(([a, b]) => duvar(hucre(a, b), acik))) return;
  o.x = nx; o.y = ny;
}
function guncelle() {
  if (bitti) { if (++gecis > 90) { bolum = (bolum + 1) % BOLUMLER.length; gecis = 0; kur(); } return; }
  if (basili('a')) kalici.A = true;
  if (basili('b')) kalici.B = true;
  const acik = kalici, h = 3.2;
  const R = oyuncular.R, Y = oyuncular.Y;
  if (tus.w) hareket(R, 0, -h, acik); if (tus.s) hareket(R, 0, h, acik); if (tus.a) hareket(R, -h, 0, acik); if (tus.d) hareket(R, h, 0, acik);
  if (tus.arrowup) hareket(Y, 0, -h, acik); if (tus.arrowdown) hareket(Y, 0, h, acik); if (tus.arrowleft) hareket(Y, -h, 0, acik); if (tus.arrowright) hareket(Y, h, 0, acik);
  adim++;
  if (hucre(R.x + 14, R.y + 14) === 'r' && hucre(Y.x + 14, Y.y + 14) === 'y') bitti = true;
}
function yildiz(cx, cy, r, renk) {
  x.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  x.fillStyle = renk; x.fill();
}
function ciz() {
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const ow = harita[0].length * T, oh = harita.length * T, olcek = Math.min(W / ow, (H - 60 * devicePixelRatio) / oh);
  x.fillStyle = '#1a1430'; x.fillRect(0, 0, W, H);
  x.save(); x.translate((W - ow * olcek) / 2, 50 * devicePixelRatio); x.scale(olcek, olcek);
  const acik = kalici, t = performance.now() / 300;
  harita.forEach((sat, y) => sat.forEach((ch, xx) => {
    const px = xx * T, py = y * T;
    x.fillStyle = (xx + y) % 2 ? '#2a2248' : '#2e2650'; x.fillRect(px, py, T, T);
    if (ch === '#') { x.fillStyle = '#5e0d10'; x.fillRect(px, py, T, T); x.fillStyle = '#7d1418'; x.fillRect(px + 2, py + 2, T - 4, T - 10); }
    if (ch === 'A' || ch === 'B') {
      x.fillStyle = acik[ch] ? 'rgba(255,255,255,.08)' : (ch === 'A' ? '#e0282f' : '#e8b630');
      x.fillRect(px + (acik[ch] ? 0 : 6), py, acik[ch] ? T : T - 12, T);
    }
    if (ch === 'a' || ch === 'b') { x.fillStyle = ch === 'a' ? '#ffd25a' : '#e0282f'; x.beginPath(); x.arc(px + T / 2, py + T / 2, basili(ch) ? 10 : 13, 0, 7); x.fill(); }
    if (ch === 'r' || ch === 'y') yildiz(px + T / 2, py + T / 2, 14 + Math.sin(t) * 2, ch === 'r' ? '#ff6b6b' : '#ffe08a');
  }));
  for (const o of Object.values(oyuncular)) {
    x.fillStyle = o.renk; x.fillRect(o.x, o.y, 28, 28);
    x.fillStyle = '#fff'; x.fillRect(o.x + 6, o.y + 8, 6, 6); x.fillRect(o.x + 16, o.y + 8, 6, 6);
    x.fillStyle = '#000'; x.fillRect(o.x + 8, o.y + 10, 3, 3); x.fillRect(o.x + 18, o.y + 10, 3, 3);
  }
  x.restore();
  const p = devicePixelRatio;
  x.fillStyle = '#fff'; x.font = `bold ${18 * p}px system-ui`; x.fillText(`Bölüm ${bolum + 1}`, 16 * p, 30 * p);
  x.font = `${14 * p}px system-ui`; x.fillStyle = '#c9c1e8';
  x.fillText('Kırmızı: W A S D   ·   Sarı: Ok tuşları   ·   Düğme, diğer rengin kapısını açar', 110 * p, 30 * p);
  if (bitti) {
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#ffd25a'; x.font = `bold ${42 * p}px system-ui`; x.textAlign = 'center';
    x.fillText('Birlikte başardınız!', W / 2, H / 2); x.textAlign = 'left';
  }
}
function dongu() { guncelle(); ciz(); requestAnimationFrame(dongu); }
kur(); dongu();
</script>
</body>
</html>
